# S1 at frame 300: the Altered Beast intro art. Genesis Plus GX's picture, compared with a mean absolute difference: the emulators convert the
# 3-bit colour levels to 8 bits differently (scenarios/compare_frames.py shows the pictures are identical once reduced to levels).
[[scenario]]
id = "S1-300"
kind = "screen"
frames = 300
files = { rom = "sega/software/roms/altered-beast/ab.smd" }
golden = "genesis/S1-altered-beast-300.png"
golden_sha256 = "2e24b6280d2f7a3209515804bab9a250922a1fd1b24009e54434cb4feb4a933a"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# S1 at frame 600: the SEGA logo has gone and the title screen is up. Genesis Plus GX's picture, compared with a mean absolute difference: the emulators convert the
# 3-bit colour levels to 8 bits differently (scenarios/compare_frames.py shows the pictures are identical once reduced to levels).
[[scenario]]
id = "S1-600"
kind = "screen"
frames = 600
files = { rom = "sega/software/roms/altered-beast/ab.smd" }
golden = "genesis/S1-altered-beast-600.png"
golden_sha256 = "ba242ce81812e63f0423c80f1dd01d39c8774fc74d1cf24c7067eab5cb56f510"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# S1T: the TMSS boot ROM's licence screen at frame 120 (the console's own start-up, then Altered Beast): Genesis Plus GX with its
# boot ROM enabled shows the same picture (identical once reduced to colour levels, frames 10-250 and 500).
[[scenario]]
id = "S1T"
kind = "screen"
frames = 120
files = { rom = "sega/software/roms/altered-beast/ab.smd", rom-tmss = "sega/software/oracles/system/bios_MD.bin" }
golden = "genesis/S1T-tmss-120.png"
golden_sha256 = "fb6e4efc3862cc9ebc7b4d4cb606885fb65826ddc28134f92400d29de69b9d14"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# P22: how many iterations of a 42-cycle loop fit in 20 lines (V counter 60 to 80), display off then on: 229 in Genesis Plus GX,
# PicoDrive and BlastEm (a 488-cycle line would give 232; the 68000 loses 2 of every 130 cycles to the bus refresh, fact M16).
# clownmdemu counts 232 (no refresh) and is not followed.
[[scenario]]
id = "P22"
kind = "memory"
frames = 60
files = { rom = "sega/software/scenarios/p22_line_cycles.md" }
start = 16711680
len = 4
golden = "genesis/p22_line_cycles.bin"
golden_sha256 = "3db40f3b2432b37709586cd4489317f9d233bd786efcc306f558808feb93361a"

# P30B: a Z80 loop reading the cartridge through its window while the 68000 counts a 42-cycle loop over 20 lines, then the Z80's
# own count. The 68000 loses cycles for each access of the Z80 to its bus (Genesis Plus GX: 208 iterations against 229 without
# the Z80; BlastEm 214, PicoDrive 213). Genesis Plus GX's dump is the golden.
[[scenario]]
id = "P30B"
kind = "memory"
frames = 90
files = { rom = "sega/software/scenarios/p30b_z80_rom_loop.md" }
start = 16711680
len = 4
golden = "genesis/p30b_z80_rom_loop.bin"
golden_sha256 = "66a5eabec24cfc39a33961a118d7c18d06a54eb520e5878d8539de9faa8835af"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the 68000 count is 209 against 208 and the Z80 count 4898 against 4099: the Z80 waits 3 clocks and the 68000 10 cycles for each access to the 68000's bus (the average of Genesis Plus GX's rule, which varies with the Z80 clock), but Genesis Plus GX's Z80 completes fewer iterations of the RAM loop as well (4010 against 4865 in BlastEm, PicoDrive and here), so its Z80 runs slower for a reason not found", evidence = "p30a_z80_ram_loop: Genesis Plus GX 00e5 0faa, PicoDrive 00e5 1302, BlastEm 00e5 1300, here 00e5 1301; p30b: 00d0 1003, 00d5 12cb, 00d6 12e0, here 00d1 1322 (probe.py scenarios/probes/p30b_z80_rom_loop.s --frames 90 --ram 0:4)" }

# P29: the lines the V counter advances while the 68000 writes 200 words to the data port from line 20: VRAM in H40 and H32 with
# the display on and off, CRAM and VSRAM with it on. Genesis Plus GX, PicoDrive and BlastEm agree (21, 7, 24, 7, 11, 11 lines);
# clownmdemu does not hold the 68000 up and is not followed.
[[scenario]]
id = "P29"
kind = "memory"
frames = 60
files = { rom = "sega/software/scenarios/p29_fifo_rate.md" }
start = 16711680
len = 12
golden = "genesis/p29_fifo_rate.bin"
golden_sha256 = "7985a1e77a22852218e6fd4c71dc41f0c244b799438379762b9193670ec67f17"
