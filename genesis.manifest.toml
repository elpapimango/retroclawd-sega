machine = "genesis"
# Probe ROMs come from scenarios/build.sh (software/scenarios/, not committed). The goldens are the memory the probes leave
# behind in Genesis Plus GX, PicoDrive, BlastEm and clownmdemu (they agree: scenarios/probe.py), never committed.

[reference]
emulator = "genesis-plus-gx"
version = "1.7.4"
command = "machines/sega/scenarios/probe.py scenarios/probes/pNN_name.s --save GOLDENS/genesis (libretro_run.py, --swap16)"

# P00: the harness smoke test: $BEEF and $CAFEF00D copied to work RAM.
[[scenario]]
id = "P00"
kind = "memory"
frames = 20
files = { rom = "sega/software/scenarios/p00_hello.md" }
start = 16711680
len = 16
golden = "genesis/p00.bin"
golden_sha256 = "300f9ecc4a6ce7776811ff903d83dc17a02a22278d9e1022a2f70bad876ef1c3"

# P02: VDP memory access through the data port (VRAM even/odd addresses, increments, CRAM and VSRAM bits, wraps); the four
# emulators agree on all of it but the read at VSRAM index 40 (clownmdemu differs) and the status word, which is not compared.
[[scenario]]
id = "P02"
kind = "memory"
frames = 30
files = { rom = "sega/software/scenarios/p02_vdp_memory.md" }
start = 16711680
len = 94
golden = "genesis/p02_vdp_memory.bin"
golden_sha256 = "2ee7ee3dec808f188000588b52b4ca0b9014bd8328d516b71b85065a52acaf3b"

# P03: byte accesses to the VDP ports: a byte written to the data or control port is the word with the byte in both halves.
[[scenario]]
id = "P03"
kind = "memory"
frames = 30
files = { rom = "sega/software/scenarios/p03_vdp_bytes.md" }
start = 16711680
len = 32
golden = "genesis/p03_vdp_bytes.bin"
golden_sha256 = "34e1f442f7ac198c50b4519db0f13c1d67f97542b102c07f9a84bcf8101dc558"

# P04: the I/O registers read as words (both bytes alike). PicoDrive reads $FF where the others read the pulled-up pins
# ($7F): Genesis Plus GX and BlastEm are followed.
[[scenario]]
id = "P04"
kind = "memory"
frames = 30
files = { rom = "sega/software/scenarios/p04_io_words.md" }
start = 16711680
len = 14
golden = "genesis/p04_io_words.bin"
golden_sha256 = "22fd1be1e253b1cfd37a7d3eeafc2872d1344ebbfdf0f5f0573a7a24a0a900ba"

# P04B: even byte reads, the data register with TH driven, an output pin readback and the transmit register
# (offsets $10-$1B of the probe; the serial control register's first read differs between emulators and is left out).
[[scenario]]
id = "P04B"
kind = "memory"
frames = 30
files = { rom = "sega/software/scenarios/p04_io_words.md" }
start = 16711696
len = 12
golden = "genesis/p04b_io_bytes.bin"
golden_sha256 = "ab1c2175c74726f81e004689225e387b5139722d97a269991c27ebf5ddf829fb"

# P05: the Z80 from both sides: Z80 RAM through the 68000 (bytes only, a word write keeps its high byte, a word read repeats
# the byte), the RAM mirror at $2000, the YM2612 area, the ROM window and the bank register, and the Z80 running its own program
# (A: 68000 side, B: RAM, C: mirror and YM reads, D: the window: $FF where the work RAM would be, E: the Z80 reached its end).
# The VDP status the Z80 reads, and the register power-on values (open bus), differ with timing and are not compared.

[[scenario]]
id = "P05A"
kind = "memory"
frames = 40
files = { rom = "sega/software/scenarios/p05_z80.md" }
start = 16711692
len = 12
golden = "genesis/p05a_68k_side.bin"
golden_sha256 = "aff910ce9fb9fd79d31ba1ea55b7755cec3accc883e1ed45fcca73e3137dba1e"

[[scenario]]
id = "P05B"
kind = "memory"
frames = 40
files = { rom = "sega/software/scenarios/p05_z80.md" }
start = 16711712
len = 6
golden = "genesis/p05b_z80_ram.bin"
golden_sha256 = "ecd7fc4e571ed017bfb8285e9e2223d5be9b56d79c23f666a12885bfd915808e"

[[scenario]]
id = "P05C"
kind = "memory"
frames = 40
files = { rom = "sega/software/scenarios/p05_z80.md" }
start = 16711728
len = 8
golden = "genesis/p05c_z80_mirror_ym.bin"
golden_sha256 = "15194ee62ca44a51535ca8c47e619351015a4162ab6211318ebd3e131ce84976"

[[scenario]]
id = "P05D"
kind = "memory"
frames = 40
files = { rom = "sega/software/scenarios/p05_z80.md" }
start = 16711744
len = 5
golden = "genesis/p05d_window.bin"
golden_sha256 = "8db4192285a2ab30d0550be51d7c8db603f9bbff86b53da853fb2bdf3d79705e"

[[scenario]]
id = "P05E"
kind = "memory"
frames = 40
files = { rom = "sega/software/scenarios/p05_z80.md" }
start = 16711775
len = 1
golden = "genesis/p05e_done.bin"
golden_sha256 = "ae3f4619b0413d70d3004b9131c3752153074e45725be13b9a148978895e359e"

# S1 at frame 300: the Altered Beast intro art. Genesis Plus GX's picture, compared with a mean absolute difference: the emulators convert the
# 3-bit colour levels to 8 bits differently (scenarios/compare_frames.py shows the pictures are identical once reduced to levels).
[[scenario]]
id = "S1-300"
kind = "screen"
frames = 300
files = { rom = "sega/software/roms/altered-beast/ab.smd" }
golden = "genesis/S1-altered-beast-300.png"
golden_sha256 = "2e24b6280d2f7a3209515804bab9a250922a1fd1b24009e54434cb4feb4a933a"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# S1 at frame 600: the SEGA logo has gone and the title screen is up. Genesis Plus GX's picture, compared with a mean absolute difference: the emulators convert the
# 3-bit colour levels to 8 bits differently (scenarios/compare_frames.py shows the pictures are identical once reduced to levels).
[[scenario]]
id = "S1-600"
kind = "screen"
frames = 600
files = { rom = "sega/software/roms/altered-beast/ab.smd" }
golden = "genesis/S1-altered-beast-600.png"
golden_sha256 = "ba242ce81812e63f0423c80f1dd01d39c8774fc74d1cf24c7067eab5cb56f510"
compare = { mode = "similarity", max_mad = 3.0, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }
