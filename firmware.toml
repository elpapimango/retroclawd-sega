# Which firmware satisfies which machine option (see retroclawd-sinclair's firmware.toml for the format).
#
# The Mega Drive needs no firmware to run a cartridge. The console's boot ROM is optional and only used when TMSS is asked for
# (`--tmss on`): it is the 2 KB ROM that shows the licence screen and starts the cartridge. It is never committed; it is
# matched by SHA-1 on the RomM server (it is the same file under the names bios_MD.bin, GEN_boot.md and tmss.md there).

[[rom]]
machines = ["genesis"]
option = "rom_tmss"
label = "Mega Drive TMSS boot ROM (bios_MD.bin)"
sha1 = ["3f50b76b0529db7f79c396b5e808cc0786ffc311"]
when = { tmss = "on" }

# ---- Sega CD / Mega-CD BIOS (128 KB), by console region. Preferred first: the 1993 revision of each region, then older ones.
# Region-free and hacked dumps on the server are not listed. Hashes are those of the RomM firmware list (2026-10-29).

[[rom]]
machines = ["segacd"]
option = "rom_bios"
label = "Sega CD BIOS (US)"
when = { console_region = "usa" }
sha1 = [
  "5adb6c3af218c60868e6b723ec47e36bbdf5e6f0",
  "f4f315adcef9b8feb0364c21ab7f0eaf5457f3ed",
  "328a3228c29fba244b9db2055adc1ec4f7a87e6b",
  "c5c24e6439a148b7f4c7ea269d09b7a23fe25075",
]

