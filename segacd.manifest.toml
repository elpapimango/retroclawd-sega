# S3 Final Fight CD at frame 2400: the game's own map screen. Its main-CPU program arrives in word RAM through a CD controller transfer made
# in 1M mode (fact E18); before that was handled the machine stayed black. Another emulator's picture, so a similarity.
[[scenario]]
id = "S3-ffcd"
kind = "screen"
frames = 2400
files = { disc = "sega/software/discs/Final Fight CD (USA)/Final Fight CD (USA).cue" }
golden = "segacd/S3-ffcd-2400.png"
golden_sha256 = "80549392098acd7d161482b18df32db4b06c11339126abbd4cec8f3460b8b142"
compare = { mode = "similarity", max_mad = 5.0, reason = "another emulator's colour levels (4.0 measured: the map is scrolling and the two are not on the same frame)" }

# S3 Snatcher at frame 1900: the Konami logo. Its graphics are loaded in 2M mode and found in the banks after the switch to 1M mode, which
# keeps the words (fact E19); before that was handled the screen stayed black. Another emulator's picture, so a similarity.
[[scenario]]
id = "S3-snatcher"
kind = "screen"
frames = 1900
files = { disc = "sega/software/discs/Snatcher (USA)/Snatcher (USA).cue" }
golden = "segacd/S3-snatcher-1900.png"
golden_sha256 = "a4037c544d3f8c5d99a2ec67c34f11d89d7b953b8df4f0d4ec4e26ef54b837d1"
compare = { mode = "similarity", max_mad = 5.0, reason = "another emulator's colour levels (and its second controller port holds a light gun by default, ours a pad)" }

# S4: no tone scenario. An audio-only disc reaches the BIOS's CD player in both emulators, but neither starts it without input and
# the button sequence that starts it was not found (Start, A, B, C and the d-pad were tried in Genesis Plus GX); the BIOS's start-up
# music is not a pure tone. The CD-DA level was compared by hand once (fact E17: RMS 4469 against 4471).
[[scenario]]
id = "S4"
kind = "audio"
frames = 1500
status = "known-gap"
files = { disc = "sega/software/scenarios/segacd-tone.cue" }
audio = { from_s = 20.0, to_s = 24.0, tone_hz = 440.0, tone_tolerance_pct = 1.0, min_amplitude = 0.05 }
gap = { reason = "the BIOS CD player needs button presses that were not found to start a track, so there is no CD-DA tone to measure; the start-up music is not a tone", evidence = "docs/hardware-facts.md fact E17 (the one manual comparison); scenarios/make_tone_disc.py builds the disc" }

# S5: the saved state is deterministic and a reload continues identically (the Mega-CD's own state, the drive's position and the
# BIOS's own handshake in flight at frame 600).
[[scenario]]
id = "S5"
kind = "state"
frames = 600
more_frames = 100
files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }

# S6: the NTSC frame is 262 lines of 3420 master clocks.
[[scenario]]
id = "S6"
kind = "timing"
frames = 100
files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }
cycles_per_frame = 896040
cycles_tolerance = 100
