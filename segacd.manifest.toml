files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }
golden = "segacd/S3-dl-1200.png"
golden_sha256 = "a718a75e8ae3a8eca5334de973838897aa78aff57df752ae928f30dda35bd624"
compare = { mode = "similarity", max_mad = 0.8, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

[[scenario]]
id = "S3-silpheed"
kind = "screen"
frames = 1200
files = { disc = "sega/software/discs/Silpheed (USA)/Silpheed (USA).cue" }
golden = "segacd/S3-silpheed-1200.png"
golden_sha256 = "735656bcf8ed5e48debbb2462608597aa8592dc2d0e790d4abb4ed43411fb663"
compare = { mode = "similarity", max_mad = 0.5, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

[[scenario]]
id = "S3-lunar"
