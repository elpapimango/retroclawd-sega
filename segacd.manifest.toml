machine = "segacd"
# The BIOS (a US Model 2, bios_CD_U.bin: RomM firmware `us_scd2_9306.bin`) goes in machines/sega/roms/segacd/ and the discs in
# machines/sega/software/discs/ (none of them committed). The goldens are Genesis Plus GX's pictures (scenarios/capture_segacd_goldens.py
# prints their hashes), never committed.

[reference]
emulator = "genesis-plus-gx"
version = "1.7.4"
command = "machines/sega/scenarios/capture_segacd_goldens.py (libretro_run.py with the Sega CD BIOS as bios_CD_U.bin in the system folder)"

[files]
rom-bios = "sega/roms/segacd/us_scd2_9306.bin"

# S1 at frames 300 and 600: the BIOS start-up animation (the Sega CD logo and the spinning earth), the same whatever disc is in.
# Mean absolute difference of 2.7 to 3.0 is the colour-level conversion (as for the Genesis scenarios), the pictures agree otherwise.
[[scenario]]
id = "S1-300"
kind = "screen"
frames = 300
files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }
golden = "segacd/S1-300.png"
golden_sha256 = "890244c7e3984f5dceaea421bd7640f0702444bb60a73e06847223eea7e5f9ea"
compare = { mode = "similarity", max_mad = 3.5, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

[[scenario]]
id = "S1-600"
kind = "screen"
frames = 600
files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }
golden = "segacd/S1-600.png"
golden_sha256 = "49b9552bca657fc52073279fd5c9b646d0f0b26d3091c87d867b8b9a64a242e9"
compare = { mode = "similarity", max_mad = 3.5, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# S1 at frame 900: the BIOS's "PRESS THE START BUTTON" screen (earth, logo, text) as the disc check begins; 0.13 mean difference.
[[scenario]]
id = "S1-900"
kind = "screen"
frames = 900
files = { disc = "sega/software/discs/dl/Dragon's Lair (USA).cue" }
golden = "segacd/S1-900.png"
golden_sha256 = "96615f955ea2b88bc0fc443dd98ef7a079205fb2668ae2d0948df7b781c73d77"
compare = { mode = "similarity", max_mad = 0.5, reason = "another emulator's colour levels: the pictures are identical once reduced to the 8 levels of each channel" }

# S3: three discs read by the BIOS (cue and BIN, whole boot-time handshake with the sub-CPU, the CD controller and the drive) to frame
