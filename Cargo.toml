[workspace]
resolver = "2"
members = ["crates/chips/ym2612", "crates/chips/sn76489", "crates/chips/vdp", "crates/chips/mcd-gate-array", "crates/chips/rf5c164", "crates/chips/mcd-asic", "crates/formats/md-cart", "crates/formats/disc", "crates/machines/genesis", "crates/machines/segacd", "crates/plugins/sega-machine-plugin", "crates/plugin-dlls/genesis"]

# Same release profile as the retroclawd host.
[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.mc68000]
opt-level = 3

[profile.release.package.z80]
opt-level = 3

[profile.release.package.machine]
opt-level = 3

[profile.release.package.genesis]
opt-level = 3

[profile.release.package.sega-machine-plugin]
strip = false

[profile.release.package.sega-machine-plugin-dll]
strip = false
